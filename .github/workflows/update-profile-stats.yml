name: Update profile stats

# Refreshes the aggregate figures in the "By the Numbers" table and regenerates
# the analytics cards in assets/ from the GitHub API.
#
# Why this exists: shields.io can serve public_repos and followers live, but it
# cannot sum forks/stars across repositories. Public github-readme-stats
# instances share one API token and return an error card with HTTP 200 once it
# is exhausted, which is invisible to status-code checks. Generating everything
# here removes both problems.

on:
  schedule:
    # 03:17 UTC daily. Off-the-hour to avoid GitHub's peak cron contention.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Collect real statistics from the GitHub API
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCOUNT: CloudTechDevOps
        run: |
          set -euo pipefail

          gh api "users/${ACCOUNT}" > user.json
          repos=$(jq -r '.public_repos' user.json)
          followers=$(jq -r '.followers' user.json)

          # --paginate applies --jq per page and streams, so this stays correct
          # past 100 repositories.
          gh api --paginate "users/${ACCOUNT}/repos?per_page=100&type=owner" \
            --jq '.[] | [.forks_count, .stargazers_count] | @tsv' > repos.tsv

          # Fail loudly rather than writing zeros if the API returned nothing.
          if [ ! -s repos.tsv ]; then
            echo "::error::No repository data returned from the GitHub API"
            exit 1
          fi

          forks=$(awk -F'\t' '{s += $1} END {print s + 0}' repos.tsv)
          stars=$(awk -F'\t' '{s += $2} END {print s + 0}' repos.tsv)

          rm -f user.json repos.tsv

          {
            echo "repos=${repos}"
            echo "followers=${followers}"
            echo "forks=${forks}"
            echo "stars=${stars}"
            echo "updated=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

          echo "Collected: repos=${repos} followers=${followers} forks=${forks} stars=${stars}"

      - name: Apply statistics and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCOUNT: CloudTechDevOps
          REPOS: ${{ steps.collect.outputs.repos }}
          FOLLOWERS: ${{ steps.collect.outputs.followers }}
          FORKS: ${{ steps.collect.outputs.forks }}
          STARS: ${{ steps.collect.outputs.stars }}
          UPDATED: ${{ steps.collect.outputs.updated }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TRACKED="README.md assets/stats-card.svg assets/languages-card.svg"

          # A direct push or an overlapping run can advance the branch between
          # checkout and push. Rather than rebasing a commit (which can conflict
          # on the same lines), reset to the freshly fetched tip and re-derive
          # the output, which is deterministic for a given set of API values.
          for attempt in 1 2 3; do
            echo "::group::Publish attempt ${attempt}"

            git fetch --quiet origin "${BRANCH}"
            git reset --quiet --hard "origin/${BRANCH}"

            python3 scripts/update_readme_stats.py
            python3 scripts/generate_cards.py

            if git diff --quiet -- ${TRACKED}; then
              echo "Statistics and cards unchanged — nothing to commit."
              echo "::endgroup::"
              exit 0
            fi

            git add ${TRACKED}
            git commit --quiet -m "chore: refresh profile statistics [skip ci]"

            if git push --quiet origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              echo "::endgroup::"
              exit 0
            fi

            echo "Push rejected — branch moved. Retrying."
            echo "::endgroup::"
            sleep $((attempt * 5))
          done

          echo "::error::Could not publish after 3 attempts"
          exit 1
