<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect x="0" y="0" width="1600" height="400" fill="#FFFFFF"/>
  <rect x="2" y="2" width="1596" height="396" fill="none" stroke="#E5E7EB" stroke-width="3"/>

  <!-- typewriter reveal mask for the name -->
  <defs>
    <mask id="typeReveal">
      <rect x="375" y="70" width="0" height="130" fill="#FFFFFF">
        <animate attributeName="width" from="0" to="860" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </mask>
  </defs>

  <g mask="url(#typeReveal)">
    <text x="400" y="170" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#000000">Veerababu Narni</text>
  </g>

  <!-- blinking cursor that disappears once typing completes -->
  <rect x="1240" y="88" width="6" height="86" fill="#000000">
    <animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="3" begin="0.2s"/>
    <animate attributeName="opacity" to="0" dur="0.1s" begin="1.8s" fill="freeze"/>
  </rect>

  <!-- role + tagline fade in after typing finishes -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.0s" fill="freeze"/>
    <text x="800" y="230" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#111111" text-anchor="middle">Senior DevOps &amp; Multi-Cloud Architect</text>
    <line x1="660" y1="258" x2="940" y2="258" stroke="#9CA3AF" stroke-width="2"/>
    <text x="800" y="292" font-family="Arial, Helvetica, sans-serif" font-size="22" font-style="italic" fill="#374151" text-anchor="middle">Building production-grade cloud infrastructure</text>
    <text x="800" y="322" font-family="Arial, Helvetica, sans-serif" font-size="22" font-style="italic" fill="#374151" text-anchor="middle">and the engineers who run it.</text>
  </g>
</svg>
