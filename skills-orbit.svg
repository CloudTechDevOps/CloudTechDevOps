<svg width="100%" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow2" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg2)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="140" x2="900" y2="140"/><line x1="0" y1="270" x2="900" y2="270"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="520"/><line x1="450" y1="0" x2="450" y2="520"/><line x1="750" y1="0" x2="750" y2="520"/>
  </g>

  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#67e8f9" letter-spacing="3">TECH STACK ORBIT</text>

  <!-- orbit rings, centered lower to leave room for the title -->
  <circle cx="450" cy="270" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="450" cy="270" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- connecting spokes -->
  <g stroke="#ffffff" stroke-opacity="0.07">
    <line x1="450" y1="270" x2="450" y2="160"/>
    <line x1="450" y1="270" x2="560" y2="270"/>
    <line x1="450" y1="270" x2="450" y2="380"/>
    <line x1="450" y1="270" x2="340" y2="270"/>
  </g>

  <!-- core -->
  <circle cx="450" cy="270" r="50" fill="url(#coreGrad)" filter="url(#glow2)" opacity="0.92">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="270" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.4"/>
  <text x="450" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#020617">VEERA</text>
  <text x="450" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#020617" opacity="0.85">DEVOPS CORE</text>

  <!-- inner ring: cloud platforms (fixed positions, horizontal labels) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
    <g transform="translate(450,160)">
      <circle r="28" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.7" stroke-width="1.5"><animate attributeName="r" values="28;30;28" dur="3s" repeatCount="indefinite"/></circle>
      <text text-anchor="middle" dy="4">AWS</text>
    </g>
    <g transform="translate(560,270)">
      <circle r="28" fill="url(#nodeFill)" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"><animate attributeName="r" values="28;30;28" dur="3.3s" repeatCount="indefinite"/></circle>
      <text text-anchor="middle" dy="4">Azure</text>
    </g>
    <g transform="translate(450,380)">
      <circle r="28" fill="url(#nodeFill)" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"><animate attributeName="r" values="28;30;28" dur="3.6s" repeatCount="indefinite"/></circle>
      <text text-anchor="middle" dy="4">GCP</text>
    </g>
    <g transform="translate(340,270)">
      <circle r="28" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.7" stroke-width="1.5"><animate attributeName="r" values="28;30;28" dur="3.9s" repeatCount="indefinite"/></circle>
      <text text-anchor="middle" dy="4" font-size="10">Oracle</text>
    </g>
  </g>

  <!-- outer ring: tooling (fixed positions around the outer circle, all text horizontal) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">
    <g transform="translate(637,138)">
      <rect x="-46" y="-16" width="92" height="32" rx="16" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.5"/>
      <text text-anchor="middle" dy="4">Kubernetes</text>
    </g>
    <g transform="translate(640,270)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="url(#nodeFill)" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text text-anchor="middle" dy="4">Terraform</text>
    </g>
    <g transform="translate(637,402)">
      <rect x="-38" y="-16" width="76" height="32" rx="16" fill="url(#nodeFill)" stroke="#34d399" stroke-opacity="0.5"/>
      <text text-anchor="middle" dy="4">Ansible</text>
    </g>
    <g transform="translate(263,402)">
      <rect x="-38" y="-16" width="76" height="32" rx="16" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.5"/>
      <text text-anchor="middle" dy="4">ArgoCD</text>
    </g>
    <g transform="translate(260,270)">
      <rect x="-34" y="-16" width="68" height="32" rx="16" fill="url(#nodeFill)" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text text-anchor="middle" dy="4">Jenkins</text>
    </g>
    <g transform="translate(263,138)">
      <rect x="-30" y="-16" width="60" height="32" rx="16" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.5"/>
      <text text-anchor="middle" dy="4">Helm</text>
    </g>
  </g>

  <!-- Gen AI / Agentic AI satellite, clearly separated below the rings -->
  <g transform="translate(450,470)">
    <circle r="32" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle r="32" fill="none" stroke="#f472b6" stroke-opacity="0.35">
      <animate attributeName="r" values="32;40;32" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text text-anchor="middle" dy="-3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Gen AI</text>
    <text text-anchor="middle" dy="12" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Agentic AI</text>
  </g>
  <line x1="450" y1="320" x2="450" y2="438" stroke="#f472b6" stroke-opacity="0.25" stroke-dasharray="3,4"/>

  <!-- outer floating tags -->
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">
    <text x="40" y="70">Prometheus</text>
    <text x="740" y="70">Grafana</text>
    <text x="30" y="490">ELK Stack</text>
    <text x="760" y="490">CloudWatch</text>
  </g>
</svg>
