<!--
  Animated tech-stack orbit.

  Motion is SMIL (<animateTransform>), which runs when an SVG is loaded via
  <img> — verified that GitHub serves this file byte-for-byte unmodified, so the
  animation reaches the browser intact.

  Each ring rotates as a group. Every node then counter-rotates about its own
  centre for the same duration, which cancels the ring's rotation for the label
  only. Without that, the text would tumble upside down as it travels.

  Geometry: centre (450,288); inner ring r=105; outer ring r=178. Extents stay
  inside the 900x520 viewBox at every angle, clear of the title and corner tags.
-->
<svg width="100%" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated technology stack orbit: AWS, Azure, GCP and Oracle Cloud orbiting a DevOps core, with Kubernetes, Terraform, Helm, ArgoCD, Jenkins, Ansible and Gen AI tooling on an outer ring">
  <title>Technology stack orbit</title>
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow2" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg2)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="140" x2="900" y2="140"/><line x1="0" y1="270" x2="900" y2="270"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="520"/><line x1="450" y1="0" x2="450" y2="520"/><line x1="750" y1="0" x2="750" y2="520"/>
  </g>

  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#67e8f9" letter-spacing="3">TECH STACK ORBIT</text>

  <!-- static guide rings -->
  <circle cx="450" cy="288" r="105" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="450" cy="288" r="178" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- counter-rotating dashed rings give a sense of depth -->
  <circle cx="450" cy="288" r="141" fill="none" stroke="#67e8f9" stroke-opacity="0.16" stroke-dasharray="5 11">
    <animateTransform attributeName="transform" type="rotate" from="0 450 288" to="360 450 288" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="288" r="205" fill="none" stroke="#a78bfa" stroke-opacity="0.13" stroke-dasharray="3 14">
    <animateTransform attributeName="transform" type="rotate" from="360 450 288" to="0 450 288" dur="34s" repeatCount="indefinite"/>
  </circle>

  <!-- core -->
  <circle cx="450" cy="288" r="50" fill="url(#coreGrad)" filter="url(#glow2)" opacity="0.92">
    <animate attributeName="opacity" values="0.82;1;0.82" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="288" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.40"/>
  <circle cx="450" cy="288" r="50" fill="none" stroke="#67e8f9" stroke-opacity="0.5">
    <animate attributeName="r" values="50;78;50" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#020617">VEERA</text>
  <text x="450" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#020617" opacity="0.85">DEVOPS CORE</text>

  <!-- ===== inner ring: cloud platforms, clockwise ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
    <animateTransform attributeName="transform" type="rotate" from="0 450 288" to="360 450 288" dur="30s" repeatCount="indefinite"/>

    <g transform="translate(450,183)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/>
      <circle r="27" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.75" stroke-width="1.5">
        <animate attributeName="r" values="27;29.5;27" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="4">AWS</text>
    </g></g>

    <g transform="translate(555,288)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/>
      <circle r="27" fill="url(#nodeFill)" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="1.5">
        <animate attributeName="r" values="27;29.5;27" dur="3.3s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="4">Azure</text>
    </g></g>

    <g transform="translate(450,393)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/>
      <circle r="27" fill="url(#nodeFill)" stroke="#34d399" stroke-opacity="0.75" stroke-width="1.5">
        <animate attributeName="r" values="27;29.5;27" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="4">GCP</text>
    </g></g>

    <g transform="translate(345,288)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/>
      <circle r="27" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.75" stroke-width="1.5">
        <animate attributeName="r" values="27;29.5;27" dur="3.9s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="4" font-size="10">Oracle</text>
    </g></g>

    <!-- travelling spark on the inner path -->
    <circle cx="450" cy="183" r="3" fill="#67e8f9" filter="url(#dotGlow)"/>
  </g>

  <!-- ===== outer ring: tooling, counter-clockwise ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">
    <animateTransform attributeName="transform" type="rotate" from="360 450 288" to="0 450 288" dur="46s" repeatCount="indefinite"/>

    <g transform="translate(450,110)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-47" y="-16" width="94" height="32" rx="16" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.55"/>
      <text text-anchor="middle" dy="4">Kubernetes</text>
    </g></g>

    <g transform="translate(576,162)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-43" y="-16" width="86" height="32" rx="16" fill="url(#nodeFill)" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text text-anchor="middle" dy="4">Terraform</text>
    </g></g>

    <g transform="translate(628,288)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-30" y="-16" width="60" height="32" rx="16" fill="url(#nodeFill)" stroke="#34d399" stroke-opacity="0.55"/>
      <text text-anchor="middle" dy="4">Helm</text>
    </g></g>

    <g transform="translate(576,414)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-38" y="-16" width="76" height="32" rx="16" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.55"/>
      <text text-anchor="middle" dy="4">ArgoCD</text>
    </g></g>

    <g transform="translate(450,466)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-37" y="-16" width="74" height="32" rx="16" fill="url(#nodeFill)" stroke="#fbbf24" stroke-opacity="0.55"/>
      <text text-anchor="middle" dy="4">Jenkins</text>
    </g></g>

    <g transform="translate(324,414)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-37" y="-16" width="74" height="32" rx="16" fill="url(#nodeFill)" stroke="#34d399" stroke-opacity="0.55"/>
      <text text-anchor="middle" dy="4">Ansible</text>
    </g></g>

    <g transform="translate(272,288)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-33" y="-16" width="66" height="32" rx="16" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.7"/>
      <text text-anchor="middle" dy="4">Gen AI</text>
    </g></g>

    <g transform="translate(324,162)"><g>
      <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="46s" repeatCount="indefinite"/>
      <rect x="-43" y="-16" width="86" height="32" rx="16" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.7"/>
      <text text-anchor="middle" dy="4">Agentic AI</text>
    </g></g>

    <circle cx="450" cy="110" r="2.6" fill="#a78bfa" filter="url(#dotGlow)"/>
  </g>

  <!-- corner readouts -->
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">
    <text x="34" y="64">Prometheus</text>
    <text x="754" y="64" text-anchor="start">Grafana</text>
    <text x="34" y="498">ELK Stack</text>
    <text x="754" y="498" text-anchor="start">CloudWatch</text>
  </g>
  <g fill="#67e8f9">
    <circle cx="24" cy="60" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="744" cy="60" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="24" cy="494" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="744" cy="494" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
