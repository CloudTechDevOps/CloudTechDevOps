<svg width="100%" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow2" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bg2)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="240" x2="900" y2="240"/><line x1="0" y1="360" x2="900" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="480"/><line x1="450" y1="0" x2="450" y2="480"/><line x1="750" y1="0" x2="750" y2="480"/>
  </g>

  <!-- orbit rings -->
  <circle cx="450" cy="240" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="450" cy="240" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="450" cy="240" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- core -->
  <circle cx="450" cy="240" r="48" fill="url(#coreGrad)" filter="url(#glow2)" opacity="0.9"/>
  <circle cx="450" cy="240" r="48" fill="none" stroke="#ffffff" stroke-opacity="0.4"/>
  <text x="450" y="234" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#020617">VEERA</text>
  <text x="450" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#020617" opacity="0.8">DEVOPS CORE</text>

  <!-- ring 1: platforms, slow rotation -->
  <g transform="translate(450,240)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <g transform="translate(110,0)"><circle r="26" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.6"/></g>
      <g transform="rotate(90) translate(110,0)"><circle r="26" fill="url(#nodeFill)" stroke="#a78bfa" stroke-opacity="0.6"/></g>
      <g transform="rotate(180) translate(110,0)"><circle r="26" fill="url(#nodeFill)" stroke="#34d399" stroke-opacity="0.6"/></g>
      <g transform="rotate(270) translate(110,0)"><circle r="26" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.6"/></g>
    </g>
  </g>
  <!-- counter-rotate labels so text stays upright -->
  <g transform="translate(450,240)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <g transform="translate(110,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="40s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">AWS</text></g></g>
      <g transform="rotate(90) translate(110,0)"><g><animateTransform attributeName="transform" type="rotate" from="-90" to="-450" dur="40s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Azure</text></g></g>
      <g transform="rotate(180) translate(110,0)"><g><animateTransform attributeName="transform" type="rotate" from="-180" to="-540" dur="40s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">GCP</text></g></g>
      <g transform="rotate(270) translate(110,0)"><g><animateTransform attributeName="transform" type="rotate" from="-270" to="-630" dur="40s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Oracle</text></g></g>
    </g>
  </g>

  <!-- ring 2: tooling, opposite rotation -->
  <g transform="translate(450,240)">
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="55s" repeatCount="indefinite"/>
      <g transform="translate(180,0)"><rect x="-34" y="-16" width="68" height="32" rx="16" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.5"/></g>
      <g transform="rotate(60) translate(180,0)"><rect x="-34" y="-16" width="68" height="32" rx="16" fill="url(#nodeFill)" stroke="#a78bfa" stroke-opacity="0.5"/></g>
      <g transform="rotate(120) translate(180,0)"><rect x="-34" y="-16" width="68" height="32" rx="16" fill="url(#nodeFill)" stroke="#34d399" stroke-opacity="0.5"/></g>
      <g transform="rotate(180) translate(180,0)"><rect x="-34" y="-16" width="68" height="32" rx="16" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.5"/></g>
      <g transform="rotate(240) translate(180,0)"><rect x="-34" y="-16" width="68" height="32" rx="16" fill="url(#nodeFill)" stroke="#fbbf24" stroke-opacity="0.5"/></g>
      <g transform="rotate(300) translate(180,0)"><rect x="-34" y="-16" width="68" height="32" rx="16" fill="url(#nodeFill)" stroke="#67e8f9" stroke-opacity="0.5"/></g>
    </g>
  </g>
  <g transform="translate(450,240)">
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="55s" repeatCount="indefinite"/>
      <g transform="translate(180,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="55s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">Kubernetes</text></g></g>
      <g transform="rotate(60) translate(180,0)"><g><animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="55s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">Terraform</text></g></g>
      <g transform="rotate(120) translate(180,0)"><g><animateTransform attributeName="transform" type="rotate" from="-120" to="240" dur="55s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">Ansible</text></g></g>
      <g transform="rotate(180) translate(180,0)"><g><animateTransform attributeName="transform" type="rotate" from="-180" to="180" dur="55s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">ArgoCD</text></g></g>
      <g transform="rotate(240) translate(180,0)"><g><animateTransform attributeName="transform" type="rotate" from="-240" to="120" dur="55s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">Jenkins</text></g></g>
      <g transform="rotate(300) translate(180,0)"><g><animateTransform attributeName="transform" type="rotate" from="-300" to="60" dur="55s" repeatCount="indefinite"/>
        <text text-anchor="middle" dy="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">Helm</text></g></g>
    </g>
  </g>

  <!-- outer floating tags -->
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#94a3b8">
    <text x="60" y="40">Prometheus</text>
    <text x="720" y="40">Grafana</text>
    <text x="40" y="450">ELK Stack</text>
    <text x="760" y="450">CloudWatch</text>
  </g>

  <!-- Gen AI / Agentic AI satellite node, own slow orbit -->
  <g transform="translate(450,240)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
      <g transform="translate(0,-220)">
        <circle r="30" fill="url(#nodeFill)" stroke="#f472b6" stroke-opacity="0.7" stroke-width="1.5"/>
        <circle r="30" fill="none" stroke="#f472b6" stroke-opacity="0.3">
          <animate attributeName="r" values="30;38;30" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
  <g transform="translate(450,240)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
      <g transform="translate(0,-220)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="70s" repeatCount="indefinite"/>
          <text text-anchor="middle" dy="-2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Gen AI</text>
          <text text-anchor="middle" dy="11" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Agentic AI</text>
        </g>
      </g>
    </g>
  </g>

  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#67e8f9" letter-spacing="2">TECH ORBIT — LIVE</text>
</svg>
